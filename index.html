<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume Builder</title>
    <meta name="description" content="Build a professional Philippine-standard resume with live preview and PDF download." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the chosen theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('rb-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
